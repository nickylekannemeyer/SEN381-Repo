name: CI
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: civicconnect/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - name: Domain + unit tests (no database)
        run: npm test

  backend-db:
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults: { run: { working-directory: civicconnect/backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: civicconnect, POSTGRES_PASSWORD: civicconnect, POSTGRES_DB: civicconnect_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://civicconnect:civicconnect@localhost:5432/civicconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - name: Full suite incl. API + EP/BVA + E2E against PostgreSQL
        run: npm test

  static-and-security:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: civicconnect/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - name: Static analysis (ESLint) - blocks on error
        run: npm run lint
      - name: Dependency / security audit - blocks on high or critical
        run: npm audit --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: civicconnect/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm run build
