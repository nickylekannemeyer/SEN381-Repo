<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CivicConnect</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <!-- Header & Logo -->
            <div class="auth-header">
                <div class="logo" style="margin-bottom: 8px;">
                    <span class="material-symbols-outlined icon-blue" style="font-size: 44px;">lock_reset</span>
                </div>
                <h2>Reset Password</h2>
                <p class="subtitle" style="line-height: 1.5;">Enter your email address and we'll send you a link to securely reset your password.</p>
            </div>

            <!-- Reset Form -->
            <form>
                <div class="form-group" style="margin-bottom: 32px;">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your registered email" required>
                </div>

                <!-- Button to "send" the link and return to login -->
                <button type="button" class="btn-primary" onclick="alert('Password reset link sent to your email!'); window.location.href='login.html'" style="width: 100%; justify-content: center; font-size: 16px;">
                    Send Reset Link
                </button>
            </form>

            <!-- Footer Link -->
            <div class="auth-footer">
                <p style="color: var(--text-muted); font-size: 14px; text-align: center;">
                    Remember your password? <a href="login.html" class="view-link" style="font-weight: 500;">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
